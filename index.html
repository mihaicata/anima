<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corvid Sight — see through a crow's eye</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap');

  :root{
    --ink: #0a0c10;
    --panel: #12151b;
    --feather-blue: #3e4c8a;
    --feather-violet: #7c5cbf;
    --uv: #9b6bff;
    --eye-amber: #d4a017;
    --paper: #e9e6df;
    --paper-dim: #9a9890;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .frame{
    position:relative;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
  }

  /* ---------- header ---------- */
  header{
    position: relative;
    padding: 18px 20px 10px;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(10,12,16,0.95), rgba(10,12,16,0));
    pointer-events:none;
  }

  .animal-picker{
    position:absolute;
    top: 16px; right: 18px;
    pointer-events:auto;
  }
  .animal-picker select{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    background: var(--panel);
    color: var(--paper);
    border: 1px solid rgba(233,230,223,0.18);
    border-radius: 999px;
    padding: 8px 28px 8px 14px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%239a9890' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 11px center;
    background-size: 9px;
  }
  .animal-picker select:focus{ outline: 1px solid var(--uv); }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--eye-amber);
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--eye-amber);
    box-shadow: 0 0 8px var(--eye-amber);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    font-size: clamp(22px, 6vw, 30px);
    margin: 4px 0 0;
    letter-spacing: -0.01em;
  }

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
  }
  video{ display:none; }
  canvas{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
  }

  .divider{
    position:absolute; top:0; bottom:0;
    width:2px;
    background: linear-gradient(to bottom, transparent, var(--uv), transparent);
    box-shadow: 0 0 14px var(--uv);
    left:50%;
    pointer-events:none;
    transition: opacity .3s;
  }

  .side-label{
    position:absolute; top: 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding: 5px 10px;
    background: rgba(10,12,16,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(233,230,223,0.15);
    border-radius: 999px;
    pointer-events:none;
  }
  .side-label.left{ left:14px; color: var(--paper-dim); }
  .side-label.right{ right:14px; color: var(--uv); border-color: rgba(155,107,255,0.35); }

  .idle{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 16px;
    text-align:center;
    padding: 30px;
  }
  .idle p{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--paper-dim);
    max-width: 320px;
    line-height:1.6;
  }
  .feather-icon{
    width: 48px; height: 48px;
    opacity:0.8;
  }

  button.primary{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    background: var(--uv);
    color: #0a0c10;
    border: none;
    padding: 13px 24px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 500;
  }
  button.primary:active{ transform: scale(0.97); }

  /* ---------- footer controls ---------- */
  footer{
    z-index: 10;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,12,16,0.97), rgba(10,12,16,0.4) 70%, transparent);
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .controls-row{
    display:flex;
    gap: 8px;
    align-items:center;
  }

  .mode-toggle{
    flex:1;
    display:flex;
    background: var(--panel);
    border: 1px solid rgba(233,230,223,0.1);
    border-radius: 999px;
    padding: 3px;
  }
  .mode-toggle button{
    flex:1;
    border:none;
    background:transparent;
    color: var(--paper-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding: 9px 6px;
    border-radius: 999px;
    cursor:pointer;
    transition: all .25s;
  }
  .mode-toggle button.active{
    background: var(--uv);
    color: #0a0c10;
    font-weight:500;
  }

  .icon-btn{
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(233,230,223,0.15);
    background: var(--panel);
    color: var(--paper);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size: 16px;
  }

  details{
    font-family:'IBM Plex Mono', monospace;
  }
  summary{
    font-size: 10px;
    letter-spacing:.1em;
    text-transform: uppercase;
    color: var(--paper-dim);
    cursor: pointer;
    list-style:none;
    display:flex; align-items:center; gap:6px;
  }
  summary::-webkit-details-marker{ display:none; }
  summary::before{
    content: "▸";
    color: var(--eye-amber);
    transition: transform .2s;
  }
  details[open] summary::before{ transform: rotate(90deg); }

  .facts{
    padding-top: 10px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .fact{
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--paper-dim);
  }
  .fact b{
    color: var(--paper);
    display:block;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size: 12.5px;
    margin-bottom: 2px;
  }

  .hint{
    font-size: 9.5px;
    color: var(--paper-dim);
    text-align:center;
    opacity: 0.6;
  }

  @media (min-width: 700px){
    .frame{ max-width: 480px; margin: 0 auto; box-shadow: 0 0 60px rgba(155,107,255,0.08); }
  }
</style>
</head>
<body>
<div class="frame">

  <header>
    <div class="eyebrow"><span class="dot"></span> <span id="genusLabel">Corvus</span> &middot; live optics</div>
    <h1 id="pageTitle">Corvid Sight</h1>
    <div class="animal-picker">
      <select id="animalSelect" aria-label="Choose animal">
        <option value="crow">Crow</option>
        <option value="panther">Panther</option>
        <option value="spider">Spider</option>
      </select>
    </div>
  </header>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="divider" id="divider" style="opacity:0;"></div>
    <div class="side-label left" id="labelLeft" style="opacity:0;">You</div>
    <div class="side-label right" id="labelRight" style="opacity:0;">Crow</div>

    <div class="idle" id="idle">
      <svg class="feather-icon" viewBox="0 0 24 24" fill="none" stroke="#d4a017" stroke-width="1.2">
        <path d="M20 4c-6 0-14 4-14 14 0 0 8-2 10-8M12 14l8-8"/>
      </svg>
      <p id="idleText">This app remaps your camera feed to approximate how a carrion crow's tetrachromatic, UV‑sensitive, motion‑tuned eyes process the same scene.</p>
      <button class="primary" id="startBtn">Open camera</button>
    </div>
  </div>

  <footer id="footer" style="display:none;">
    <div class="controls-row">
      <div class="mode-toggle">
        <button id="modeSplit" class="active">Split</button>
        <button id="modeFull">Full animal</button>
        <button id="modeHuman">Full human</button>
      </div>
      <button class="icon-btn" id="flipBtn" title="Flip camera">⟲</button>
    </div>

    <details>
      <summary>Why it looks like this</summary>
      <div class="facts" id="facts"></div>
    </details>
    <div class="hint">Video is processed on‑device only — nothing is uploaded or stored.</div>
  </footer>

</div>

<script>
(function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const stage = document.getElementById('stage');
  const idle = document.getElementById('idle');
  const footer = document.getElementById('footer');
  const startBtn = document.getElementById('startBtn');
  const flipBtn = document.getElementById('flipBtn');
  const divider = document.getElementById('divider');
  const labelLeft = document.getElementById('labelLeft');
  const labelRight = document.getElementById('labelRight');
  const modeBtns = {
    split: document.getElementById('modeSplit'),
    full: document.getElementById('modeFull'),
    human: document.getElementById('modeHuman'),
  };
  const animalSelect = document.getElementById('animalSelect');
  const genusLabel = document.getElementById('genusLabel');
  const pageTitle = document.getElementById('pageTitle');
  const idleText = document.getElementById('idleText');
  const factsEl = document.getElementById('facts');

  const ANIMALS = {
    crow: {
      label: 'Crow',
      genus: 'Corvus',
      appTitle: 'Corvid Sight',
      idle: "This app remaps your camera feed to approximate how a carrion crow's tetrachromatic, UV‑sensitive, motion‑tuned eyes process the same scene.",
      facts: [
        ['Fourth cone', 'Crows are tetrachromats — a UV‑sensitive cone lets them see near‑ultraviolet, rendered here as violet bloom.'],
        ['Muted red', 'Corvid colour space leans blue/violet‑forward with weaker long‑wavelength (red) response, so warm tones are pulled down.'],
        ['Faster flicker fusion', 'Crows resolve motion at a higher rate than we do — moving edges are highlighted in cyan as things a crow would catch that we might miss.'],
        ['Wider field', 'Laterally set eyes give near‑panoramic view. The gentle edge‑darkening hints at that broader periphery.'],
      ],
    },
    panther: {
      label: 'Panther',
      genus: 'Panthera',
      appTitle: 'Panther Sight',
      idle: "This app remaps your camera feed to approximate how a panther's rod‑dominant, low‑light‑amplifying, dichromatic eyes process the same scene.",
      facts: [
        ['Rod-dominant retina', 'Panthers pack far more rod cells than humans, amplifying dim light so shadows lift and detail survives after dark.'],
        ['Dichromatic colour', 'With only two cone types, reds fade toward grey while blues and greens stay dominant.'],
        ['Tapetum lucidum', 'A reflective layer behind the retina bounces light back through it — bright highlights bloom with an eye‑shine glow.'],
        ['Ambush motion sense', 'Tuned for tracking movement in low light — shifting edges flash amber‑green as a big cat\'s gaze would catch them.'],
      ],
    },
    spider: {
      label: 'Spider',
      genus: 'Araneae',
      appTitle: 'Spider Sight',
      idle: "This app remaps your camera feed to approximate how a jumping spider's many simple eyes — sharp centre, UV‑tinted, wide but blurry periphery — process the same scene.",
      facts: [
        ['Principal eyes', 'A forward pair gives sharp detail in a narrow foveal zone at the centre of view — everything else falls off in acuity.'],
        ['Green–UV vision', 'Most spiders lack red‑sensitive receptors, seeing mostly in green and near‑ultraviolet, rendered here as a cool violet‑green tint.'],
        ['Eight simple eyes', 'Not a compound eye — several simple lenses cover different fields, hinted at here by the faceted grid overlay.'],
        ['Blurry periphery', 'Outside the principal gaze, resolution drops sharply, so the frame softens and desaturates toward its edges.'],
      ],
    },
  };

  let mode = 'split';
  let animal = 'crow';
  let facing = 'environment';
  let stream = null;
  let prevGray = null; // Uint8ClampedArray for motion detection
  let rafId = null;

  function setMode(m){
    mode = m;
    Object.keys(modeBtns).forEach(k => modeBtns[k].classList.toggle('active', k === m));
    const showChrome = m === 'split';
    divider.style.opacity = showChrome ? 1 : 0;
    labelLeft.style.opacity = showChrome ? 1 : 0;
    labelRight.style.opacity = showChrome ? 1 : 0;
  }
  modeBtns.split.onclick = () => setMode('split');
  modeBtns.full.onclick = () => setMode('full');
  modeBtns.human.onclick = () => setMode('human');

  function setAnimal(key){
    animal = key;
    const info = ANIMALS[key];
    genusLabel.textContent = info.genus;
    pageTitle.textContent = info.appTitle;
    document.title = info.appTitle + ' — see through a ' + info.label.toLowerCase() + "'s eye";
    idleText.textContent = info.idle;
    labelRight.textContent = info.label;
    factsEl.innerHTML = info.facts.map(([t, d]) => `<div class="fact"><b>${t}</b>${d}</div>`).join('');
    modeBtns.full.textContent = 'Full ' + info.label.toLowerCase();
    prevGray = null; // filter response differs per animal — start clean
  }
  animalSelect.value = animal;
  animalSelect.onchange = () => setAnimal(animalSelect.value);
  setAnimal(animal);

  async function startCamera(){
    try{
      if(stream){ stream.getTracks().forEach(t => t.stop()); }
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width:{ideal:1280}, height:{ideal:960} },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      idle.style.display = 'none';
      footer.style.display = 'flex';
      resizeCanvas();
      prevGray = null;
      if(!rafId) loop();
    }catch(err){
      idle.querySelector('p').textContent = 'Camera access was blocked or unavailable: ' + err.message;
    }
  }

  startBtn.onclick = startCamera;
  flipBtn.onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };

  function resizeCanvas(){
    const rect = stage.getBoundingClientRect();
    canvas.width = rect.width * (window.devicePixelRatio > 1 ? 1.2 : 1);
    canvas.height = rect.height * (window.devicePixelRatio > 1 ? 1.2 : 1);
  }
  window.addEventListener('resize', resizeCanvas);

  // draw video into canvas with object-fit: cover behaviour
  function drawCoverFrame(targetCtx, dx, dw){
    const vw = video.videoWidth, vh = video.videoHeight;
    if(!vw) return;
    const ch = canvas.height;
    const scale = Math.max(dw / vw, ch / vh);
    const sw = dw / scale, sh = ch / scale;
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    targetCtx.drawImage(video, sx, sy, sw, sh, dx, 0, dw, ch);
  }

  // crow: tetrachromatic / UV-lean colour remap + flicker-fusion motion highlight
  function applyCrowVision(imageData, prevGrayRef, w, h){
    const d = imageData.data;
    const newGray = new Uint8ClampedArray(w*h);
    const cx = w/2, cy = h/2;
    const maxDist = Math.sqrt(cx*cx+cy*cy);

    for(let i=0, p=0; i<d.length; i+=4, p++){
      let r = d[i], g = d[i+1], b = d[i+2];

      const gray = 0.299*r + 0.587*g + 0.114*b;
      newGray[p] = gray;

      // suppress long-wavelength red, boost blue-violet, push a UV-simulated violet channel
      const uvBoost = Math.max(0, b - r) * 0.5 + gray * 0.12;
      let nr = r * 0.55 + uvBoost * 0.25;
      let ng = g * 0.85 + uvBoost * 0.15;
      let nb = Math.min(255, b * 1.35 + uvBoost * 0.6 + 18);

      // motion highlight (flicker-fusion simulation): compare to previous frame
      if(prevGrayRef){
        const diff = Math.abs(gray - prevGrayRef[p]);
        if(diff > 14){
          const boost = Math.min(1, diff/60);
          nr = nr*(1-boost) + 30*boost;
          ng = ng*(1-boost) + 220*boost;
          nb = nb*(1-boost) + 255*boost;
        }
      }

      // peripheral vignette hint (wide FOV → attention falls toward center-forward)
      const px = p % w, py = (p / w) | 0;
      const dist = Math.sqrt((px-cx)*(px-cx) + (py-cy)*(py-cy)) / maxDist;
      const vig = 1 - Math.pow(dist, 3) * 0.35;

      d[i]   = nr * vig;
      d[i+1] = ng * vig;
      d[i+2] = nb * vig;
    }
    return newGray;
  }

  // panther: rod-dominant low-light amplification, dichromatic desaturation, tapetum glow
  function applyPantherVision(imageData, prevGrayRef, w, h){
    const d = imageData.data;
    const newGray = new Uint8ClampedArray(w*h);
    const cx = w/2, cy = h/2;
    const maxDist = Math.sqrt(cx*cx+cy*cy);

    for(let i=0, p=0; i<d.length; i+=4, p++){
      let r = d[i], g = d[i+1], b = d[i+2];

      const gray = 0.299*r + 0.587*g + 0.114*b;
      newGray[p] = gray;

      // low-light amplification: brighten shadows via gamma lift
      const amp = Math.pow(gray/255, 0.55) * 255;

      // dichromatic, blue-green-forward colour with weak red, desaturated toward luminance
      const satMix = 0.55;
      let nr = (r*0.3 + amp*0.15) * (1-satMix) + amp*satMix;
      let ng = (g*0.75 + amp*0.35) * (1-satMix) + amp*satMix*1.05;
      let nb = (b*0.55 + amp*0.45) * (1-satMix) + amp*satMix*0.95;

      // motion sensitivity of an ambush predator: flash amber-green on movement
      if(prevGrayRef){
        const diff = Math.abs(gray - prevGrayRef[p]);
        if(diff > 12){
          const boost = Math.min(1, diff/50);
          nr = nr*(1-boost) + 40*boost;
          ng = ng*(1-boost) + 200*boost;
          nb = nb*(1-boost) + 80*boost;
        }
      }

      // tapetum lucidum eye-shine glow on bright highlights
      if(gray > 210){
        ng = Math.min(255, ng*1.15 + 20);
        nb = Math.min(255, nb*1.1 + 10);
      }

      const px = p % w, py = (p / w) | 0;
      const dist = Math.sqrt((px-cx)*(px-cx) + (py-cy)*(py-cy)) / maxDist;
      const vig = 1 - Math.pow(dist, 3) * 0.25;

      d[i]   = nr * vig;
      d[i+1] = ng * vig;
      d[i+2] = nb * vig;
    }
    return newGray;
  }

  // spider: green/UV-forward dichromacy, sharp foveal centre, faceted-eye grid, blurry periphery
  function applySpiderVision(imageData, prevGrayRef, w, h){
    const d = imageData.data;
    const newGray = new Uint8ClampedArray(w*h);
    const cx = w/2, cy = h/2;
    const maxDist = Math.sqrt(cx*cx+cy*cy);
    const block = Math.max(4, Math.round(w/70));

    for(let i=0, p=0; i<d.length; i+=4, p++){
      let r = d[i], g = d[i+1], b = d[i+2];

      const gray = 0.299*r + 0.587*g + 0.114*b;
      newGray[p] = gray;

      // green/UV-forward dichromacy, very weak red response
      const uvBoost = Math.max(0, b - r) * 0.4 + gray * 0.1;
      let nr = r * 0.25 + uvBoost * 0.2;
      let ng = g * 1.05 + uvBoost * 0.2;
      let nb = Math.min(255, b * 0.9 + uvBoost * 0.7 + 12);

      const px = p % w, py = (p / w) | 0;
      const dist = Math.sqrt((px-cx)*(px-cx) + (py-cy)*(py-cy)) / maxDist;

      // acuity falls off sharply outside the principal-eye foveal zone
      const acuityFall = dist > 0.28 ? Math.min(1, (dist-0.28)/0.5) : 0;
      nr = nr*(1-acuityFall*0.5) + gray*(acuityFall*0.5);
      ng = ng*(1-acuityFall*0.3) + gray*(acuityFall*0.3);

      // faceted secondary-eye grid overlay
      if(px % block === 0 || py % block === 0){
        nr *= 0.82; ng *= 0.82; nb *= 0.82;
      }

      const vig = 1 - Math.pow(dist, 3) * 0.4;

      d[i]   = nr * vig;
      d[i+1] = ng * vig;
      d[i+2] = nb * vig;
    }
    return newGray;
  }

  const VISION_FILTERS = {
    crow: applyCrowVision,
    panther: applyPantherVision,
    spider: applySpiderVision,
  };

  let lastMode = null;
  let lastAnimal = null;

  function loop(){
    if(video.readyState >= 2 && video.videoWidth){
      const w = canvas.width, h = canvas.height;

      // reset motion-tracking buffer whenever mode/animal or size changes,
      // since the processed region's dimensions or filter differ
      if(mode !== lastMode || animal !== lastAnimal){ prevGray = null; lastMode = mode; lastAnimal = animal; }

      const applyVision = VISION_FILTERS[animal];

      ctx.clearRect(0,0,w,h);
      drawCoverFrame(ctx, 0, w);

      if(mode === 'human'){
        // nothing further — raw feed only
      } else if(mode === 'full'){
        const frame = ctx.getImageData(0,0,w,h);
        prevGray = applyVision(frame, prevGray, w, h);
        ctx.putImageData(frame, 0, 0);
      } else { // split — left half stays human, right half becomes the selected animal's vision
        const half = Math.floor(w/2);
        const rightW = w - half;
        const rightFrame = ctx.getImageData(half, 0, rightW, h);
        prevGray = applyVision(rightFrame, prevGray, rightW, h);
        ctx.putImageData(rightFrame, half, 0);
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  // pause camera when tab hidden to save battery
  document.addEventListener('visibilitychange', () => {
    if(document.hidden && stream){ stream.getTracks().forEach(t=>t.enabled=false); }
    else if(stream){ stream.getTracks().forEach(t=>t.enabled=true); }
  });
})();
</script>
</body>
  </html>
